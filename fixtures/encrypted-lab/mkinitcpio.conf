# SPDX-License-Identifier: MIT
# Self-contained VM provisioning/recovery tools, not full installer hardware media.
MODULES=(virtio_pci virtio_blk btrfs isofs vfat dm_crypt)
BINARIES=(/usr/bin/bash /usr/bin/sfdisk /usr/bin/blockdev /usr/bin/wipefs /usr/bin/readlink /usr/bin/mkfs.fat /usr/bin/mkfs.btrfs /usr/bin/btrfs /usr/bin/blkid /usr/bin/mount /usr/bin/umount /usr/bin/cp /usr/bin/chmod /usr/bin/mkdir /usr/bin/chroot /usr/bin/sync /usr/bin/pacman /usr/bin/sha256sum /usr/bin/sort /usr/bin/diff /usr/bin/find /usr/bin/stat /usr/bin/cat /usr/bin/cryptsetup /usr/bin/sed /usr/bin/grep /usr/bin/findmnt /usr/bin/getfacl /usr/bin/getcap /usr/bin/systemd-ask-password)
FILES=(/usr/lib/enzimos-lab/provision.sh /usr/lib/systemd/system/enzimos-target-provision.service /usr/lib/systemd/system/enzimos-target-provision.target)
HOOKS=(base systemd modconf block sd-encrypt filesystems)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T1)
