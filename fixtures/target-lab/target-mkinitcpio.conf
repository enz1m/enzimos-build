# SPDX-License-Identifier: MIT
# Unencrypted virtual-disk fixture; not a change to the LUKS2 product default.
MODULES=(virtio_pci virtio_blk btrfs)
BINARIES=()
FILES=()
# Detect devices inside the guest, not from the host. Explicit modules above keep
# both kernel flavors bootable; broad installer hardware coverage is unqualified.
HOOKS=(base systemd autodetect modconf block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T1)
