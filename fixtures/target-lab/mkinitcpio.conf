# SPDX-License-Identifier: MIT
# Private VM provisioner, not a shipping installer or storage configuration.
MODULES=(virtio_pci virtio_blk btrfs isofs vfat)
BINARIES=(/usr/bin/bash /usr/bin/sfdisk /usr/bin/blockdev /usr/bin/wipefs /usr/bin/readlink /usr/bin/mkfs.fat /usr/bin/mkfs.btrfs /usr/bin/btrfs /usr/bin/blkid /usr/bin/mount /usr/bin/umount /usr/bin/cp /usr/bin/chmod /usr/bin/mkdir /usr/bin/chroot /usr/bin/sync /usr/bin/pacman /usr/bin/gpg /usr/bin/gpgconf /usr/bin/gpg-connect-agent /usr/bin/sha256sum /usr/bin/sort /usr/bin/diff /usr/bin/find /usr/bin/stat /usr/bin/cat)
FILES=(/usr/lib/enzimos-lab/provision.sh /usr/lib/systemd/system/enzimos-target-provision.service /usr/lib/systemd/system/enzimos-target-provision.target)
HOOKS=(base systemd modconf block filesystems)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T1)
